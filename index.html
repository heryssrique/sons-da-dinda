<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons da Live da Dinda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600&display=swap">
<style>
  :root { --wood: #f3c98b; --wood-dark: #c98b45; --ink: #3b2412; --yellow: #ffe14d; --pink: #ff5fa2; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px; font-family: Fredoka, sans-serif; color: var(--ink);
    background:
      linear-gradient(100deg, transparent 88%, #7fd3e8 92%, #2bb5d6 100%),
      radial-gradient(circle at 20% 30%, #fbe7c0, #f1d39a 70%);
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .placa {
    display: block; width: fit-content; margin: 8px auto 20px; padding: 10px 32px;
    background: linear-gradient(#a8693a, #7d4a24); border: 4px solid #5e3416; border-radius: 14px;
    font: 400 clamp(26px, 5vw, 56px) 'Luckiest Guy', cursive; color: #fff6e0;
    text-shadow: 3px 3px 0 #5e3416; box-shadow: 0 6px 0 #5e3416; text-align: center;
  }
  .placa span { color: var(--pink); text-shadow: 3px 3px 0 #fff, 5px 5px 0 #5e3416; }
  .placa.novos { color: var(--yellow); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .som {
    position: relative; padding: 8px 6px; border: 2px solid var(--wood-dark); border-radius: 8px;
    background: linear-gradient(#f8d9a6, var(--wood)); box-shadow: 0 3px 0 var(--wood-dark);
    font: 600 17px Fredoka, sans-serif; color: var(--ink); cursor: pointer; text-align: center;
    overflow-wrap: anywhere;
  }
  .som:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
  .novo .som { background: linear-gradient(#fff07a, var(--yellow)); border-color: #d1a900; box-shadow: 0 3px 0 #d1a900; }
  .apagar {
    position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: #d33; color: #fff; font-weight: 700; cursor: pointer; line-height: 22px; padding: 0;
  }
  form { display: flex; gap: 8px; justify-content: center; margin: 20px 0 8px; flex-wrap: wrap; }
  input {
    flex: 1 1 220px; max-width: 320px; padding: 10px 12px; font: 600 17px Fredoka, sans-serif;
    border: 2px solid var(--wood-dark); border-radius: 8px; background: #fffaf0;
  }
  button.add {
    padding: 10px 18px; font: 400 20px 'Luckiest Guy', cursive; color: #fff; cursor: pointer;
    background: var(--pink); border: 2px solid #c2337a; border-radius: 8px; box-shadow: 0 3px 0 #c2337a;
  }
  #aviso { text-align: center; min-height: 1.4em; margin: 0; }
  .rodape { text-align: center; margin: 24px 0 0; }
  .link { background: none; border: 0; padding: 4px; font: 600 14px Fredoka, sans-serif; color: var(--ink); opacity: .6; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="placa">Sons da live da <span>Dinda</span></h1>
  <div class="grade" id="sons"></div>

  <h2 class="placa novos">Novos sons</h2>
  <div class="grade novo" id="novos"></div>

  <form id="form" hidden>
    <input id="cmd" placeholder="novo comando, ex: !bomdia" autocomplete="off" required maxlength="30" aria-label="Novo comando">
    <button class="add">Adicionar</button>
  </form>
  <p id="aviso" role="status"></p>
  <p class="rodape"><button id="entrar" class="link" type="button">Entrar para editar</button></p>
</div>

<script>
const SONS = `10mil abafa calar elevoltou big eunaoaceito exacly meautosabotei morreu naovainao seliga surto
uiquedelicia verdade voupracasa euadoro elanaovemmais sugardaddy apagaisso partiuaglomerar trindom pagode
peixe calma orianna taric vayne pediu socorro naodoeu mentira bixa tira doendo desumano pau explodir queodio
voucagar barraco pintam milreais pix naotenho dois queen fimdomundo mulher perae fazendomerda eladisseisso
grito ai gogogo ahh gemidao morra rezando eoutra ahri coco para vemca starmie peidao euquero mami meperdoa
sumir oxente vergonha balao fogo scat chanel tratando limpatudo alivia gata mendiga violento possofalar
loira autoestima`.split(/\s+/);
const NOVOS = 'ajoelhar vagabunda eai carreira orar ganhou sotemgay parabens buceta aplausos gemido meusqueridos fodase'.split(' ');
let extras = [];
const aviso = t => { document.getElementById('aviso').textContent = t; };

// Só quem tem a senha edita; ela fica neste navegador para não pedir toda vez.
let senha = '';
try { senha = localStorage.getItem('sons-senha') || ''; } catch {}
function modoEdicao(s) {
  senha = s;
  try { s ? localStorage.setItem('sons-senha', s) : localStorage.removeItem('sons-senha'); } catch {}
  document.getElementById('form').hidden = !s;
  document.getElementById('entrar').textContent = s ? 'Sair da edição' : 'Entrar para editar';
  render();
}
document.getElementById('entrar').onclick = async () => {
  if (senha) return modoEdicao('');
  const s = prompt('Senha para editar:');
  if (!s) return;
  const r = await fetch('/api/sons?verificar=1', { method: 'POST', headers: { 'x-senha': s } }).catch(() => null);
  if (r && r.ok) { modoEdicao(s); aviso('Modo edição ligado'); } else aviso(r && r.status === 401 ? 'Senha errada' : 'Não deu para verificar, tente de novo');
};

// Sons novos ficam no servidor (api/sons.js), então todo mundo vê a mesma lista.
async function carregar() {
  try {
    const r = await fetch('/api/sons', { cache: 'no-store' });
    if (!r.ok) throw 0;
    extras = await r.json();
    render();
  } catch { aviso('Não deu para carregar os sons novos'); }
}

async function api(metodo, nome) {
  const r = await fetch('/api/sons?nome=' + encodeURIComponent(nome), { method: metodo, headers: { 'x-senha': senha } }).catch(() => null);
  if (r && r.status === 401) { modoEdicao(''); aviso('Senha mudou ou está errada, entre de novo'); return false; }
  if (!r || !r.ok) {
    const { erro } = r ? await r.json().catch(() => ({})) : {};
    aviso(erro || 'Não deu para salvar, tente de novo');
    return false;
  }
  await carregar();
  return true;
}

function botao(nome, apagavel) {
  const b = document.createElement('button');
  b.className = 'som';
  b.textContent = '!' + nome;
  b.title = 'Clique para copiar';
  b.onclick = () => navigator.clipboard.writeText('!' + nome).then(() => aviso(`!${nome} copiado`), () => aviso('Não deu para copiar'));
  if (apagavel) {
    const x = document.createElement('span');
    x.className = 'apagar'; x.textContent = '×'; x.title = 'Remover'; x.setAttribute('role', 'button');
    x.onclick = e => { e.stopPropagation(); if (confirm(`Remover !${nome} para todo mundo?`)) api('DELETE', nome).then(ok => ok && aviso(`!${nome} removido`)); };
    b.append(x);
  }
  return b;
}

function render() {
  document.getElementById('sons').replaceChildren(...SONS.map(n => botao(n)));
  document.getElementById('novos').replaceChildren(...NOVOS.map(n => botao(n)), ...extras.map(n => botao(n, !!senha)));
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('cmd');
  const nome = input.value.trim().toLowerCase().replace(/^!+/, '').replace(/\s+/g, '');
  if (!nome) return;
  if (!/^[a-z0-9]{1,30}$/.test(nome)) return aviso('Use só letras e números, sem acento');
  if ([...SONS, ...NOVOS, ...extras].includes(nome)) return aviso(`!${nome} já existe`);
  api('POST', nome).then(ok => { if (ok) { input.value = ''; aviso(`!${nome} adicionado`); } });
};

modoEdicao(senha);
carregar();
</script>
</body>
</html>
