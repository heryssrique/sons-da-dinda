<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons da Live da Dinda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap">
<style>
  /* Visual do overlay da live: areia, mar no canto, molduras laranja, balões creme e etiquetas azuis. */
  :root {
    --areia: #f6dc93; --laranja: #f7a51c; --laranja-esc: #d9820a; --creme: #fdf7e6;
    --azul: #49b3dc; --azul-esc: #2e8fb8; --tinta: #8a5a12; --marrom: #6b4208;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* senão o display:flex do form vence o atributo hidden */
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 40px; font-family: 'Bree Serif', Georgia, serif; color: var(--tinta);
    /* areia real do overlay (azulejo espelhado, sem costura) */
    background: var(--areia) url(areia.webp) repeat; background-size: 840px auto; background-attachment: fixed;
    overflow-x: hidden;
  }
  /* vídeo da live em loop de 10 s atrás de tudo: a onda vem e volta; a areia (acima) aparece enquanto ele carrega */
  .fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
  .deco { position: fixed; pointer-events: none; z-index: 0; line-height: 1; filter: drop-shadow(1px 2px 1px rgba(120, 80, 10, .35)); }
  .deco svg { display: block; }
  .chinelos { width: 28.4cm; height: auto; left: -2cm; top: 3cm; transform: rotate(-14deg); filter: drop-shadow(4px 8px 6px rgba(80, 50, 10, .35)); }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
  .titulo {
    display: block; width: fit-content; max-width: 100%; margin: 0 auto 34px; padding: 6px 28px;
    font: 400 clamp(20px, 3.4vw, 30px) 'Bree Serif', Georgia, serif; color: #fff; text-align: center;
    background: var(--laranja); border-radius: 999px; box-shadow: 0 3px 0 var(--laranja-esc); text-shadow: 1px 1px 0 var(--laranja-esc);
  }
  .painel {
    background: rgba(253, 247, 230, .72); border: 6px solid var(--laranja); border-radius: 14px;
    box-shadow: 0 4px 0 var(--laranja-esc), 0 10px 22px rgba(120, 80, 10, .2); padding: 18px 14px 16px; position: relative;
  }
  .etiqueta {
    display: block; width: fit-content; margin: -36px auto 14px; padding: 6px 26px; border-radius: 999px;
    background: var(--laranja); color: #fff; font-size: clamp(18px, 3vw, 24px); letter-spacing: .5px;
    box-shadow: 0 3px 0 var(--laranja-esc); text-shadow: 1px 1px 0 var(--laranja-esc);
  }
  .etiqueta.azul { background: var(--azul); box-shadow: 0 3px 0 var(--azul-esc); text-shadow: 1px 1px 0 var(--azul-esc); }
  .painel + .painel { margin-top: 40px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .vazio { grid-column: 1 / -1; text-align: center; opacity: .7; margin: 0; }
  .som {
    position: relative; padding: 9px 6px; border: 0; border-radius: 10px;
    background: var(--creme); box-shadow: 0 2px 0 #e6d7ad, 0 4px 8px rgba(120, 80, 10, .12);
    font: 400 17px 'Bree Serif', Georgia, serif; color: var(--tinta); cursor: pointer; text-align: center;
    overflow-wrap: anywhere;
  }
  .som:hover { background: #fff; }
  .som:active { transform: translateY(2px); box-shadow: 0 1px 0 #e6d7ad; }
  .novo .som { background: var(--azul); color: #fff; box-shadow: 0 3px 0 var(--azul-esc), 0 4px 8px rgba(20, 80, 110, .2); }
  .novo .som:hover { background: #5cc0e6; }
  .apagar {
    position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: #d33; color: #fff; font: 700 14px sans-serif; cursor: pointer; line-height: 22px; padding: 0;
  }
  form { display: flex; gap: 8px; justify-content: center; margin: 24px 0 8px; flex-wrap: wrap; }
  input, select {
    padding: 10px 12px; font: 400 17px 'Bree Serif', Georgia, serif;
    border: 3px solid var(--laranja); border-radius: 10px; background: var(--creme); color: var(--tinta);
  }
  input { flex: 1 1 220px; max-width: 320px; }
  button.add {
    padding: 10px 20px; font: 400 18px 'Bree Serif', Georgia, serif; color: #fff; cursor: pointer;
    background: var(--laranja); border: 0; border-radius: 999px; box-shadow: 0 3px 0 var(--laranja-esc);
  }
  #aviso { text-align: center; min-height: 1.4em; margin: 8px 0 0; color: var(--marrom); }
  .rodape { text-align: center; margin: 20px 0 0; }
  .link { background: none; border: 0; padding: 4px; font: 400 14px 'Bree Serif', Georgia, serif; color: var(--marrom); opacity: .7; text-decoration: underline; cursor: pointer; }
  @media (max-width: 640px) {
    .deco.grande { display: none; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 8px; }
    .painel { padding: 18px 10px 12px; }
  }
</style>
</head>
<body>
<!-- enfeites do overlay: conchas e estrelas-do-mar nos cantos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="estrela" viewBox="0 0 100 100"><path d="M50 4c5 0 8 22 12 30s27 4 29 9-18 15-21 24 9 26 5 30-21-10-25-10-21 14-25 10 8-21 5-30S7 48 9 43s25-1 29-9S45 4 50 4z" fill="#f59b4c" stroke="#d9732a" stroke-width="3"/><g fill="#ffd2a6"><circle cx="50" cy="22" r="2.5"/><circle cx="50" cy="34" r="2.5"/><circle cx="76" cy="44" r="2.5"/><circle cx="24" cy="44" r="2.5"/><circle cx="64" cy="76" r="2.5"/><circle cx="36" cy="76" r="2.5"/></g></symbol>
    <symbol id="concha" viewBox="0 0 100 90"><path d="M50 86 12 46C4 30 20 6 50 6s46 24 38 40z" fill="#fcd25c" stroke="#e0a526" stroke-width="3"/><g stroke="#e0a526" stroke-width="3" fill="none"><path d="M50 86V8M50 86 27 12M50 86 73 12M50 86 13 30M50 86 87 30"/></g><path d="M40 86h20l-4 4H44z" fill="#e0a526"/></symbol>
  </defs>
</svg>
<video class="fundo" src="fundo.mp4" poster="fundo.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<!-- chinelos 41/42 de verdade (foto), em tamanho real: cada sola tem ~815 px na imagem de 848 px = 27,3 cm, então a imagem tem 848/815 x 27,3 = 28,4 cm -->
<img class="deco grande chinelos" src="chinelos.webp" alt="" width="848" height="983">
<span class="deco" style="right:28px;top:28px"><svg width="40" height="36"><use href="#concha"/></svg></span>
<span class="deco grande" style="right:40px;top:150px;transform:rotate(18deg)"><svg width="54" height="54"><use href="#estrela"/></svg></span>
<span class="deco" style="right:14px;bottom:14px;transform:rotate(-20deg)"><svg width="46" height="46"><use href="#estrela"/></svg></span>
<span class="deco grande" style="left:46%;bottom:8px;transform:rotate(8deg)"><svg width="34" height="30"><use href="#concha"/></svg></span>

<div class="wrap">
  <h1 class="titulo">Sons da live da Dinda</h1>

  <section class="painel">
    <h2 class="etiqueta">Sons</h2>
    <div class="grade" id="sons"><p class="vazio">Carregando…</p></div>
  </section>

  <section class="painel">
    <h2 class="etiqueta azul">Novos sons</h2>
    <div class="grade novo" id="novos"></div>
  </section>

  <form id="form" hidden>
    <input id="cmd" placeholder="novo comando, ex: !bomdia" autocomplete="off" required maxlength="31" aria-label="Novo comando">
    <select id="secao" aria-label="Seção">
      <option value="novos">em Novos sons</option>
      <option value="sons">em Sons</option>
    </select>
    <button class="add">Adicionar</button>
  </form>
  <p id="aviso" role="status"></p>
  <p class="rodape"><button id="entrar" class="link" type="button">Entrar para editar</button></p>
</div>

<script>
// Todos os sons ficam no servidor (api/sons.js): todo mundo vê a mesma lista e só quem tem a senha edita.
let lista = { sons: [], novos: [] };
let carregou = false;
const aviso = t => { document.getElementById('aviso').textContent = t; };

// A senha fica neste navegador para não pedir toda vez.
let senha = '';
try { senha = localStorage.getItem('sons-senha') || ''; } catch {}

function modoEdicao(s) {
  senha = s;
  try { s ? localStorage.setItem('sons-senha', s) : localStorage.removeItem('sons-senha'); } catch {}
  document.getElementById('form').hidden = !s;
  document.getElementById('entrar').textContent = s ? 'Sair da edição' : 'Entrar para editar';
  render();
}

document.getElementById('entrar').onclick = async () => {
  if (senha) return modoEdicao('');
  const s = prompt('Senha para editar:');
  if (!s) return;
  const r = await fetch('/api/sons?verificar=1', { method: 'POST', headers: { 'x-senha': s } }).catch(() => null);
  if (r && r.ok) { modoEdicao(s); aviso('Modo edição ligado: dá para adicionar e remover qualquer som'); }
  else aviso(r && r.status === 401 ? 'Senha errada' : 'Não deu para verificar, tente de novo');
};

async function carregar() {
  try {
    const r = await fetch('/api/sons', { cache: 'no-store' });
    if (!r.ok) throw 0;
    lista = await r.json();
    carregou = true;
    render();
  } catch { aviso('Não deu para carregar os sons, recarregue a página'); }
}

async function api(metodo, secao, nome) {
  const q = new URLSearchParams({ secao, nome });
  const r = await fetch('/api/sons?' + q, { method: metodo, headers: { 'x-senha': senha } }).catch(() => null);
  if (r && r.status === 401) { modoEdicao(''); aviso('Senha mudou ou está errada, entre de novo'); return false; }
  if (!r || !r.ok) {
    const { erro } = r ? await r.json().catch(() => ({})) : {};
    aviso(erro || 'Não deu para salvar, tente de novo');
    return false;
  }
  await carregar();
  return true;
}

function botao(secao, nome) {
  const b = document.createElement('button');
  b.className = 'som';
  b.textContent = '!' + nome;
  b.title = 'Clique para copiar';
  b.onclick = () => navigator.clipboard.writeText('!' + nome).then(() => aviso(`!${nome} copiado`), () => aviso('Não deu para copiar'));
  if (senha) {
    const x = document.createElement('span');
    x.className = 'apagar'; x.textContent = '×'; x.title = 'Remover'; x.setAttribute('role', 'button');
    x.onclick = e => { e.stopPropagation(); if (confirm(`Remover !${nome} para todo mundo?`)) api('DELETE', secao, nome).then(ok => ok && aviso(`!${nome} removido`)); };
    b.append(x);
  }
  return b;
}

function render() {
  if (!carregou) return;
  for (const secao of ['sons', 'novos']) {
    const itens = lista[secao].map(n => botao(secao, n));
    if (!itens.length) itens.push(Object.assign(document.createElement('p'), { className: 'vazio', textContent: 'Nenhum som aqui ainda' }));
    document.getElementById(secao).replaceChildren(...itens);
  }
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('cmd');
  const secao = document.getElementById('secao').value;
  const nome = input.value.trim().toLowerCase().replace(/^!+/, '').replace(/\s+/g, '');
  if (!nome) return;
  if (!/^[a-z0-9]{1,30}$/.test(nome)) return aviso('Use só letras e números, sem acento');
  if ([...lista.sons, ...lista.novos].includes(nome)) return aviso(`!${nome} já existe`);
  api('POST', secao, nome).then(ok => { if (ok) { input.value = ''; aviso(`!${nome} adicionado`); } });
};

// quem pediu menos movimento no sistema vê o vídeo parado
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('.fundo').pause();

modoEdicao(senha);
carregar();
</script>
</body>
</html>
